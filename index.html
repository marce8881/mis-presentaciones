<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Pobreza en México (2008-2018)</title>
    <!-- Carga de la API de Google Charts -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['corechart', 'bar']});
        google.charts.setOnLoadCallback(drawAllCharts);

        function drawAllCharts() {
            drawChart1();
            drawChart2();
            drawChart3();
            drawChart4();
            drawChart5();
        }

        // 1. Gráfico de Líneas: Evolución Nacional (Ajustado a Millones con Puntos y Etiquetas)
        function drawChart1() {
            var data = google.visualization.arrayToDataTable([
                ['Año', 'Pobreza', {role: 'annotation'}, 'Pobreza Extrema', {role: 'annotation'}],
                ['2008', 49.5, '49.5', 12.3, '12.3'],
                ['2010', 52.8, '52.8', 13.0, '13.0'],
                ['2012', 53.3, '53.3', 11.5, '11.5'],
                ['2014', 55.3, '55.3', 11.4, '11.4'],
                ['2016', 53.4, '53.4', 9.4, '9.4'],
                ['2018', 52.4, '52.4', 9.3, '9.3']
            ]);
            var options = { 
                title: 'Evolución Nacional de la Pobreza (2008-2018)',
                vAxis: { title: 'Millones de personas', minValue: 0 },
                hAxis: { title: 'Año' },
                curveType: 'function',
                pointSize: 6, // Puntos identificadores
                legend: { position: 'bottom' },
                colors: ['#264653', '#e76f51'] // Paleta Armónica
            };
            var chart = new google.visualization.LineChart(document.getElementById('chart1_div'));
            chart.draw(data, options);
        }

        // 2. Gráfico Circular: Distribución con Total de Referencia
        function drawChart2() {
            var data = google.visualization.arrayToDataTable([
                ['Indicador', 'Millones de Personas'],
                ['Pobreza (Moderada y Extrema)', 52.4],
                ['Vulnerables (Carencias sociales)', 36.7],
                ['Vulnerables (Ingresos)', 8.6],
                ['No pobre y no vulnerable', 27.4]
            ]);
            var options = { 
                title: 'Distribución de la Población Nacional en 2018 \n(Total referente: 125.1 Millones de personas)', 
                pieHole: 0.4, 
                colors: ['#e76f51', '#f4a261', '#e9c46a', '#2a9d8f']
            };
            var chart = new google.visualization.PieChart(document.getElementById('chart2_div'));
            chart.draw(data, options);
        }

        // 3. Gráfico de Barras: Muestra de Estados
        function drawChart3() {
            var data = google.visualization.arrayToDataTable([
                ['Estado', '2008 (%)', '2018 (%)'],
                ['Aguascalientes', 4.2, 1.2],
                ['Baja California', 3.3, 1.6],
                ['Campeche', 11.9, 9.8],
                ['Coahuila', 3.1, 1.4],
                ['Chiapas', 38.7, 29.7]
            ]);
            var options = { 
                title: 'Pobreza Extrema: Entidades Seleccionadas (2008 vs 2018)', 
                bars: 'horizontal',
                colors: ['#e9c46a', '#e76f51']
            };
            var chart = new google.visualization.BarChart(document.getElementById('chart3_div'));
            chart.draw(data, options);
        }

// 4. Gráfico de Áreas: Evolución de Carencias
        function drawChart4() {
            var data = google.visualization.arrayToDataTable([
                ['Año', 'Pobl. en Pobreza', 'Pobl. en Pobreza Extrema'],
                ['2008', 2.8, 3.9],
                ['2010', 2.6, 3.8],
                ['2012', 2.4, 3.7],
                ['2014', 2.3, 3.6],
                ['2016', 2.2, 3.5],
                ['2018', 2.2, 3.6]
            ]);
            var options = { 
                title: 'Promedio de Carencias Sociales (2008-2018)', 
                vAxis: { title: 'Promedio de carencias' }, // Título añadido al eje Y
                hAxis: { title: 'Año' }, // Título añadido al eje X
                isStacked: false,
                colors: ['#264653', '#e76f51']
            };
            var chart = new google.visualization.AreaChart(document.getElementById('chart4_div'));
            chart.draw(data, options);
        }

        // 5. Gráfico de Barras Horizontales: Todos los estados ordenados con destacados
        function drawChart5() {
            var data = google.visualization.arrayToDataTable([
                ['Estado', 'Millones de Personas', { role: 'style' }, { role: 'annotation' }],
                ['Chiapas', 1.62, 'color: #e76f51', '1.62'],
                ['Veracruz', 1.46, 'color: #e76f51', '1.46'],
                ['Guerrero', 0.97, 'color: #e76f51', '0.97'],
                ['Oaxaca', 0.95, 'color: #e76f51', '0.95'],
                ['México', 0.87, 'color: #e76f51', '0.87'],
                ['Puebla', 0.55, 'color: #f2c7ba', ''],
                ['Tabasco', 0.30, 'color: #f2c7ba', ''],
                ['Michoacán', 0.28, 'color: #f2c7ba', ''],
                ['Guanajuato', 0.25, 'color: #f2c7ba', ''],
                ['Jalisco', 0.24, 'color: #f2c7ba', ''],
                ['San Luis Potosí', 0.21, 'color: #f2c7ba', ''],
                ['Hidalgo', 0.18, 'color: #f2c7ba', ''],
                ['Ciudad de México', 0.15, 'color: #f2c7ba', ''],
                ['Yucatán', 0.15, 'color: #f2c7ba', ''],
                ['Morelos', 0.15, 'color: #f2c7ba', ''],
                ['Tamaulipas', 0.12, 'color: #f2c7ba', ''],
                ['Chihuahua', 0.10, 'color: #f2c7ba', ''],
                ['Campeche', 0.09, 'color: #f2c7ba', ''],
                ['Sinaloa', 0.08, 'color: #f2c7ba', ''],
                ['Sonora', 0.08, 'color: #f2c7ba', ''],
                ['Nayarit', 0.08, 'color: #f2c7ba', ''],
                ['Quintana Roo', 0.06, 'color: #f2c7ba', ''],
                ['Baja California', 0.06, 'color: #f2c7ba', ''],
                ['Zacatecas', 0.05, 'color: #f2c7ba', ''],
                ['Coahuila', 0.04, 'color: #f2c7ba', ''],
                ['Tlaxcala', 0.04, 'color: #f2c7ba', ''],
                ['Querétaro', 0.04, 'color: #f2c7ba', ''],
                ['Durango', 0.04, 'color: #f2c7ba', ''],
                ['Nuevo León', 0.03, 'color: #f2c7ba', ''],
                ['Colima', 0.02, 'color: #f2c7ba', ''],
                ['Aguascalientes', 0.02, 'color: #f2c7ba', ''],
                ['Baja California Sur', 0.01, 'color: #f2c7ba', '']
            ]);
            var options = { 
                title: 'Volumen de Pobreza Extrema por Estado en 2018 (Millones de Personas)', 
                legend: { position: 'none' },
                hAxis: { title: 'Millones de Personas' },
                chartArea: { width: '65%', height: '85%' }
            };
            var chart = new google.visualization.BarChart(document.getElementById('chart5_div'));
            chart.draw(data, options);
        }
    </script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px; 
        }
        h1 {
            text-align: center;
            color: #264653;
            margin-bottom: 30px;
        }
        .dashboard { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 20px; 
            justify-content: center; 
        }
        .chart-container { 
            width: 48%; 
            min-width: 500px;
            height: 400px; 
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 10px;
        }
        /* Clase específica para hacer más alto el gráfico de 32 estados */
        .chart-tall {
            width: 98%;
            height: 800px; 
        }
    </style>
</head>
<body>
    <h1>Tablero Visual: 10 Años de Medición de Pobreza en México</h1>
    <div class="dashboard">
        <div id="chart1_div" class="chart-container"></div>
        <div id="chart2_div" class="chart-container"></div>
        <div id="chart3_div" class="chart-container"></div>
        <div id="chart4_div" class="chart-container"></div>
        <div id="chart5_div" class="chart-container chart-tall"></div> <!-- Contenedor ampliado -->
    </div>
</body>
</html>
